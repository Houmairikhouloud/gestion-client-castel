# Port du Backend
server.port=8081

# Connexion PostgreSQL (mettez votre mot de passe à la place de 'password')
spring.datasource.url=jdbc:postgresql://localhost:5432/client_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate (affiche les requêtes SQL dans la console)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sécurité Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/castel-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/castel-realm/protocol/openid-connect/certs